<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>TP01 WebAR - Exercice 1</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene id="mainScene" background="color: #ECECEC">

    <!-- Plan de base -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="20"
      height="20"
      color="#7BC8A4">
    </a-plane>

    <!-- Boite rouge -->
    <a-box
      position="-3 2 -3"
      color="#E74C3C"
      width="1.5" height="1.5" depth="1.5">
    </a-box>

    <!-- Boite verte -->
    <a-box
      position="0 2 0"
      color="#2ECC71"
      width="1.5" height="1.5" depth="1.5">
    </a-box>

    <!-- Boite bleue -->
    <a-box
      position="3 2 3"
      color="#3498DB"
      width="1.5" height="1.5" depth="1.5">
    </a-box>

    <!-- Lumieres pour bien voir les couleurs -->
    <a-light type="ambient" color="#FFFFFF" intensity="0.6"></a-light>
    <a-light type="directional" color="#FFFFFF" intensity="0.8" position="2 4 2"></a-light>

    <!-- Camera : hauteur=10, distance horizontale=15 -->
    <a-entity
      id="mainCamera"
      position="10.6 10 10.6"
      camera
      wasd-controls>
    </a-entity>

  </a-scene>

  <script>
    // Une fois la scene chargee, on oriente manuellement la camera vers le centre du plan (0,0,0)
    const sceneEl = document.querySelector('#mainScene');
    sceneEl.addEventListener('loaded', function () {
      const cameraEl = document.querySelector('#mainCamera');
      cameraEl.object3D.lookAt(0, 0, 0);
    });
  </script>
</body>
</html>
