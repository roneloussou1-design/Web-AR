<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TP01 WebAR - Exercice 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!-- Bibliothèque A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Bibliothèque AR.js pour A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // Composant personnalisé : gère le changement de couleur + l'animation
      // supplémentaire (rotation accélérée) lorsqu'on clique/tape sur l'entité.
      AFRAME.registerComponent('clickable-box', {
        schema: {
          colors: { default: ['#4CC9F0', '#F94144', '#F9C74F', '#90BE6D'] }
        },
        init: function () {
          this.colorIndex = 0;
          this.el.addEventListener('click', this.onClick.bind(this));
        },
        onClick: function () {
          const el = this.el;

          // 1. Changement de couleur (on passe à la couleur suivante dans la liste)
          this.colorIndex = (this.colorIndex + 1) % this.data.colors.length;
          el.setAttribute('color', this.data.colors[this.colorIndex]);

          // 2. Animation supplémentaire au clic : la boîte grossit puis reprend
          //    sa taille normale (effet de "pulse"), et sa rotation s'accélère
          //    temporairement.
          el.setAttribute('animation__pulse', {
            property: 'scale',
            from: '1 1 1',
            to: '1.6 1.6 1.6',
            dur: 200,
            dir: 'alternate',
            loop: 1,
            easing: 'easeInOutQuad'
          });

          el.setAttribute('animation', {
            property: 'rotation',
            to: '0 360 0',
            loop: true,
            dur: 800,
            easing: 'linear'
          });
        }
      });
    </script>
    <style>
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Ecran de chargement le temps que la caméra / les librairies démarrent -->
    <div class="arjs-loader">
      <div>Chargement, veuillez patienter...</div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;">

      <a-marker preset="hiro">
        <!-- Boîte semi-transparente qui tourne automatiquement -->
        <a-box
          id="interactive-box"
          position="0 0.5 0"
          color="#4CC9F0"
          opacity="0.6"
          transparent="true"
          class="clickable"
          clickable-box
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-box>
      </a-marker>

      <a-entity camera>
        <!-- Curseur : petit anneau au centre de l'écran qui sert de "viseur".
             raycaster cible les éléments avec la classe "clickable". -->
        <a-cursor
          raycaster="objects: .clickable"
          fuse="true"
          fuse-timeout="500"
          color="#FFFFFF">
        </a-cursor>
      </a-entity>

    </a-scene>

  </body>
</html>
