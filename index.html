<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TP01 WebAR - Exercice 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <!-- Bibliothèque A-Frame -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Bibliothèque AR.js pour A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script>
      // Composant personnalisé : gère le changement de couleur + l'animation
      // supplémentaire (rotation accélérée) lorsqu'on clique/tape sur l'entité.
      AFRAME.registerComponent('clickable-box', {
        schema: {
          colors: { default: ['#4CC9F0', '#F94144', '#F9C74F', '#90BE6D'] }
        },
        init: function () {
          this.colorIndex = 0;
          this.el.addEventListener('click', this.onClick.bind(this));
        },
        onClick: function () {
          const el = this.el;

          // 1. Changement de couleur (on passe à la couleur suivante dans la liste)
          this.colorIndex = (this.colorIndex + 1) % this.data.colors.length;
          el.setAttribute('color', this.data.colors[this.colorIndex]);

          // 2. Animation supplémentaire au clic : la boîte grossit puis reprend
          //    sa taille normale (effet de "pulse"), et sa rotation s'accélère
          //    temporairement.
          el.setAttribute('animation__pulse', {
            property: 'scale',
            from: '1 1 1',
            to: '1.6 1.6 1.6',
            dur: 200,
            dir: 'alternate',
            loop: 1,
            easing: 'easeInOutQuad'
          });

          el.setAttribute('animation', {
            property: 'rotation',
            to: '0 360 0',
            loop: true,
            dur: 800,
            easing: 'linear'
          });
        }
      });

      // Exercice 6 : gestion de l'UI DOM overlay liée au marker Hiro
      window.addEventListener('DOMContentLoaded', function () {
        const marker = document.querySelector('#hiro-marker');
        const ui = document.querySelector('#ui-overlay');
        const box = document.querySelector('#interactive-box');
        const slider = document.querySelector('#size-slider');
        const sizeValueLabel = document.querySelector('#size-value');

        // Afficher l'UI uniquement quand le marker Hiro est détecté
        marker.addEventListener('markerFound', function () {
          ui.classList.add('visible');
        });
        marker.addEventListener('markerLost', function () {
          ui.classList.remove('visible');
        });

        // Slider : change la taille (échelle) de la boîte en temps réel
        slider.addEventListener('input', function (evt) {
          const value = parseFloat(evt.target.value);
          box.setAttribute('scale', `${value} ${value} ${value}`);
          sizeValueLabel.textContent = value.toFixed(1);
        });

        // Palette de couleurs : change immédiatement la couleur de la boîte
        document.querySelectorAll('.color-swatch').forEach(function (swatch) {
          swatch.addEventListener('click', function () {
            box.setAttribute('color', swatch.dataset.color);
          });
        });
      });
    </script>
    <style>
      .arjs-loader {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .arjs-loader div {
        text-align: center;
        font-size: 1.25em;
        color: white;
      }

      /* Exercice 6 : UI DOM overlay */
      #ui-overlay {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 16px 20px 24px;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        font-family: sans-serif;
        z-index: 10000;
        /* Masquée par défaut, affichée seulement quand le marker Hiro est détecté */
        display: none;
      }
      #ui-overlay.visible {
        display: block;
      }
      #ui-overlay .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      #ui-overlay .row:last-child {
        margin-bottom: 0;
      }
      #ui-overlay label {
        font-size: 0.9em;
        min-width: 90px;
      }
      #size-slider {
        flex: 1;
      }
      #size-value {
        min-width: 30px;
        text-align: right;
        font-size: 0.9em;
      }
      .color-swatch {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid white;
        cursor: pointer;
        padding: 0;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Ecran de chargement le temps que la caméra / les librairies démarrent -->
    <div class="arjs-loader">
      <div>Chargement, veuillez patienter...</div>
    </div>

    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono;"
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;">

      <a-marker preset="hiro" id="hiro-marker">
        <!-- Boîte semi-transparente qui tourne automatiquement -->
        <a-box
          id="interactive-box"
          position="0 0.5 0"
          color="#4CC9F0"
          opacity="0.6"
          transparent="true"
          class="clickable"
          clickable-box
          animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear">
        </a-box>
      </a-marker>

      <!-- Exercice 4 : marker personnalisé (fusée), fait apparaître un cône -->
      <a-marker type="pattern" url="rocket-marker.patt">
        <a-cone
          position="0 0.75 0"
          radius-bottom="0.6"
          radius-top="0"
          height="1.5"
          color="#F72585"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000; easing: linear">
        </a-cone>
      </a-marker>

      <a-entity camera>
        <!-- Curseur : petit anneau au centre de l'écran qui sert de "viseur".
             raycaster cible les éléments avec la classe "clickable". -->
        <a-cursor
          raycaster="objects: .clickable"
          fuse="true"
          fuse-timeout="500"
          color="#FFFFFF">
        </a-cursor>
      </a-entity>

    </a-scene>

    <!-- Exercice 6 : UI DOM overlay, visible seulement quand le marker Hiro est détecté -->
    <div id="ui-overlay">
      <div class="row">
        <label for="size-slider">Taille</label>
        <input type="range" id="size-slider" min="0.1" max="3.0" step="0.1" value="1">
        <span id="size-value">1.0</span>
      </div>
      <div class="row">
        <label>Couleur</label>
        <button class="color-swatch" style="background:#E63946" data-color="#E63946" aria-label="Rouge"></button>
        <button class="color-swatch" style="background:#2A9D8F" data-color="#2A9D8F" aria-label="Vert"></button>
        <button class="color-swatch" style="background:#264653" data-color="#264653" aria-label="Bleu"></button>
      </div>
    </div>

  </body>
</html>
